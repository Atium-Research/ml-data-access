[project]
name = "ml-data-access"
version = "0.1.0"
description = "Read side of the malatium data store: one loader per bear-lake table."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bear-lake>=0.1.5",
    "polars>=1.30",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/Atium-Research/ml-data-access"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_data_access"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
